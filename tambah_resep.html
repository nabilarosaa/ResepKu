<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Resep | ResepKu</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="script.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#ee6123',
                        ink: '#333333',
                        cream: '#FFFDFB',
                    },
                    fontFamily: {
                        sans: ['"Clarity City"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                },
            },
        };
    </script>
</head>
<body class="min-h-screen bg-cream font-sans text-ink">

    <header class="relative mx-4 mt-5">
        <nav class="mx-auto flex h-14 w-[90vw] items-center justify-between rounded-full bg-primary/10 px-6 font-semibold md:h-16 md:w-[85vw] lg:w-[57vw] lg:justify-around lg:px-0">
            <a href="index.html"><img src="assets/resepku.svg" alt="Logo ResepKu" class="max-w-[110px] md:max-w-[150px]"></a>

            <div class="hidden items-center gap-8 text-primary md:flex">
                <a href="index.html" class="border-b-2 border-transparent hover:border-primary">Beranda</a>
                <a href="resep_saya.html" class="border-b-2 border-transparent hover:border-primary">Resep Saya</a>
                <a href="#" class="border-b-2 border-transparent hover:border-primary">Favorit</a>
                <a href="#" class="border-b-2 border-transparent hover:border-primary">Profil</a>
            </div>

            <button id="menuBtn" type="button" aria-label="Buka menu" aria-expanded="false" class="flex flex-col gap-[5px] p-2 md:hidden">
                <span class="block h-[3px] w-6 rounded bg-primary"></span>
                <span class="block h-[3px] w-6 rounded bg-primary"></span>
                <span class="block h-[3px] w-6 rounded bg-primary"></span>
            </button>
        </nav>

        <div id="mobileMenu" class="absolute left-1/2 top-16 z-50 hidden w-[90vw] max-w-xs -translate-x-1/2 flex-col items-center gap-5 rounded-3xl bg-cream py-8 font-semibold text-primary shadow-xl md:hidden">
            <a href="index.html">Beranda</a>
            <a href="resep_saya.html">Resep Saya</a>
            <a href="#">Favorit</a>
            <a href="#">Profil</a>
        </div>
    </header>

    <main class="mx-auto max-w-3xl px-4 py-10 md:px-8">
        <h1 class="text-2xl font-bold md:text-3xl">Tambah Resep</h1>
        <p class="mt-1">Isi detail resepmu, lalu simpan.</p>

        <form action="detail_resep.html" class="mt-8 grid grid-cols-1 gap-6 rounded-2xl border border-primary/15 bg-white p-6 md:grid-cols-2 md:p-8">

            <div class="md:col-span-2">
                <label for="judul" class="mb-2 block font-semibold">Judul</label>
                <input type="text" id="judul" name="judul" placeholder="Judul hidangan" required
                    class="w-full rounded-xl border border-primary/30 px-4 py-3 outline-none focus:border-primary">
            </div>

            <div class="md:col-span-2">
                <label for="foto" class="mb-2 block font-semibold">Foto Hidangan</label>
                <input type="file" id="foto" name="foto" accept="image/*"
                    class="w-full rounded-xl border border-dashed border-primary/40 px-4 py-3 file:mr-4 file:rounded-full file:border-0 file:bg-primary/10 file:px-4 file:py-2 file:font-semibold file:text-primary">
            </div>

            <div class="md:col-span-2">
                <label for="kategori" class="mb-2 block font-semibold">Kategori</label>
                <select id="kategori" name="kategori" required
                    class="w-full rounded-xl border border-primary/30 bg-white px-4 py-3 outline-none focus:border-primary">
                    <option value="sarapan">Sarapan</option>
                    <option value="makan_siang">Makan Siang</option>
                    <option value="pasta">Pasta</option>
                    <option value="dessert">Dessert</option>
                    <option value="minuman">Minuman</option>
                </select>
            </div>

            <div>
                <label for="waktu_masak" class="mb-2 block font-semibold">Waktu Masak (menit)</label>
                <input type="number" id="waktu_masak" name="waktu_masak" min="1" placeholder="Contoh: 20"
                    class="w-full rounded-xl border border-primary/30 px-4 py-3 outline-none focus:border-primary">
            </div>

            <div>
                <label for="porsi" class="mb-2 block font-semibold">Porsi</label>
                <input type="number" id="porsi" name="porsi" min="1" placeholder="Masukkan jumlah porsi"
                    class="w-full rounded-xl border border-primary/30 px-4 py-3 outline-none focus:border-primary">
            </div>

            <div class="md:col-span-2">
                <label for="deskripsi" class="mb-2 block font-semibold">Deskripsi Singkat</label>
                <textarea id="deskripsi" name="deskripsi" rows="3" placeholder="Masukkan deskripsi singkat"
                    class="w-full rounded-xl border border-primary/30 px-4 py-3 outline-none focus:border-primary"></textarea>
            </div>

            <div>
                <label for="daftar_bahan" class="mb-2 block font-semibold">Daftar Bahan</label>
                <textarea id="daftar_bahan" name="daftar_bahan" rows="7" placeholder="Masukkan daftar bahan"
                    class="w-full rounded-xl border border-primary/30 px-4 py-3 outline-none focus:border-primary"></textarea>
            </div>

            <div>
                <label for="langkah" class="mb-2 block font-semibold">Langkah Memasak</label>
                <textarea id="langkah" name="langkah" rows="7" placeholder="Masukkan langkah memasak"
                    class="w-full rounded-xl border border-primary/30 px-4 py-3 outline-none focus:border-primary"></textarea>
            </div>

            <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end md:col-span-2">
                <a href="resep_saya.html" class="rounded-full border border-primary px-8 py-3 text-center font-semibold text-primary hover:bg-primary/10">Batal</a>
                <button type="submit" class="rounded-full bg-primary px-8 py-3 font-semibold text-white hover:opacity-90">Simpan</button>
            </div>
        </form>
    </main>

    <script>
        const btn = document.getElementById('menuBtn');
        const menu = document.getElementById('mobileMenu');
        btn.addEventListener('click', () => {
            const terbuka = menu.classList.toggle('hidden') === false;
            menu.classList.toggle('flex', terbuka);
            btn.setAttribute('aria-expanded', terbuka);
        });
    </script>
</body>
</html>
